<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vappie" />
  <meta name="description" content="Vappie - verenigingenbeheer voor Zomerparkfeest" />
  <title>Vappie | Team Verenigingen</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="stylesheet" href="./styles.css?v=31" />
  <link rel="stylesheet" href="./enhancements.css?v=31" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=31">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=31">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=31">
</head>
<body>
  <div id="app"></div>
  <noscript>Vappie heeft JavaScript nodig om te werken.</noscript>

  <script>
    // SYNC FIX v31: Supabase is leidend bij een nieuwe app-start.
    try { localStorage.removeItem('vappie-supabase-dirty-v1'); } catch (_) {}

    let vappieHiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        vappieHiddenAt = Date.now();
      } else if (vappieHiddenAt && Date.now() - vappieHiddenAt > 30000) {
        location.reload();
      }
    });
  </script>

  <script src="./seedData.js?v=31"></script>
  <script async src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./app.js?v=31"></script>
  <script src="./enhancements.js?v=31"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/service-worker.js?v=31', { updateViaCache: 'none' });
          await reg.update();
        } catch (err) {
          console.warn('PWA service worker niet actief:', err);
        }
      });
    }
  </script>
</body>
</html>
